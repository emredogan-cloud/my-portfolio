<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="64" x2="64" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <linearGradient id="g2" x1="16" y1="48" x2="48" y2="16">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <!-- Rising blueprint lines -->
  <path d="M12 52 L24 28 L32 36 L44 12" stroke="url(#g2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M20 52 L32 20 L40 30 L52 8" stroke="url(#g1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Nodes -->
  <circle cx="20" cy="52" r="4" fill="url(#g1)"/>
  <circle cx="32" cy="20" r="5" fill="url(#g1)"/>
  <circle cx="40" cy="30" r="3.5" fill="url(#g1)"/>
  <circle cx="52" cy="8" r="4" fill="url(#g1)"/>
  <!-- Node inner glow -->
  <circle cx="32" cy="20" r="2.5" fill="#050b12" opacity="0.5"/>
  <circle cx="52" cy="8" r="2" fill="#050b12" opacity="0.5"/>
  <!-- Connection lines (horizontal brain links) -->
  <line x1="24" y1="28" x2="40" y2="30" stroke="url(#g2)" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="12" y1="52" x2="20" y2="52" stroke="url(#g2)" stroke-width="1"/>
</svg>
